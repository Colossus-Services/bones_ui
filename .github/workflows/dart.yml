name: Dart CI

env:
  DART_VERSION: "latest"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

# A new push to the same branch/PR cancels its running jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - name: Dart version
        run: |
          dart --version
          uname -a
      # Upgrade (not just get): resolves the newest dependencies, as a
      # fresh `dart pub global activate bones_ui` does.
      - name: Upgrade dependencies
        run: dart pub upgrade
      - name: dart format
        run: dart format -o none --set-exit-if-changed .
      - name: dart analyze
        run: dart analyze --fatal-infos --fatal-warnings .
      - name: dependency_validator
        run: dart run dependency_validator
#      - name: dartdoc
#        run: dart doc --dry-run
      - name: dart pub publish --dry-run
        run: dart pub publish --dry-run


  test_vm:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - name: Dart version
        run: |
          dart --version
          uname -a
      # Upgrade (not just get): resolves the newest dependencies, as a
      # fresh `dart pub global activate bones_ui` does.
      - name: Upgrade dependencies
        run: dart pub upgrade
      - name: Run tests (VM)
        run: dart test --platform vm


  test_chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - name: Dart version
        run: |
          dart --version
          uname -a
      # Upgrade (not just get): resolves the newest dependencies, as a
      # fresh `dart pub global activate bones_ui` does.
      - name: Upgrade dependencies
        run: dart pub upgrade
      - name: Run tests (Chrome Wasm)
        run: dart test --platform chrome --compiler dart2wasm
      - name: Run tests (Chrome JS)
        run: dart test --platform chrome --compiler dart2js --coverage=./coverage
      - name: Generate coverage report
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage --packages=.dart_tool/package_config.json --report-on=lib --lcov -o ./coverage/lcov.info -i ./coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage/
          flags: unittests
          env_vars: OS,DART
          fail_ci_if_error: true
          verbose: true

