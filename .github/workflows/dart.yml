name: Dart CI

env:
  DART_VERSION: "latest"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

# A new push to the same branch/PR cancels its running jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - name: Dart version
        run: |
          dart --version
          uname -a
      # Upgrade (not just get): resolves the newest dependencies, as a
      # fresh `dart pub global activate bones_ui` does.
      - name: Upgrade dependencies
        run: dart pub upgrade
      - name: dart format
        run: dart format -o none --set-exit-if-changed .
      - name: dart analyze
        run: dart analyze --fatal-infos --fatal-warnings .
      - name: dependency_validator
        run: dart run dependency_validator
#      - name: dartdoc
#        run: dart doc --dry-run
      - name: dart pub publish --dry-run
        run: dart pub publish --dry-run


  test_vm:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - name: Dart version
        run: |
          dart --version
          uname -a
      # Upgrade (not just get): resolves the newest dependencies, as a
      # fresh `dart pub global activate bones_ui` does.
      - name: Upgrade dependencies
        run: dart pub upgrade
      - name: Run tests (VM)
        run: dart test --platform vm --concurrency=4


  # The browser tests, by compiler and shard of the test files, all in
  # parallel (most of their time is compiling each test file). Each shard
  # runs its test files in parallel too (`TEST_CONCURRENCY`): since 3.1.8 a
  # test root waits for its async work and shuts down after its tests, so
  # the coverage no longer misses the lines run late (async contents,
  # loadings, calendar events...). The coverage of each dart2js shard is
  # uploaded, merged by Codecov (`.codecov.yml`).
  test_chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # The number of `matrix.shard`s (also `after_n_builds` in `.codecov.yml`):
      TEST_SHARDS: 3
      # Test files run at once by each shard (the runner has 4 vCPUs):
      TEST_CONCURRENCY: 4

    strategy:
      fail-fast: false
      matrix:
        compiler: [ dart2wasm, dart2js ]
        shard: [ 0, 1, 2 ]

    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - name: Dart version
        run: |
          dart --version
          uname -a
      # Upgrade (not just get): resolves the newest dependencies, as a
      # fresh `dart pub global activate bones_ui` does.
      - name: Upgrade dependencies
        run: dart pub upgrade
      # This shard's test files: every `TEST_SHARDS`th one, by name (a new
      # test file is included; the VM-only ones are skipped on Chrome).
      - name: Select test files
        run: |
          files=$(ls test/*_test.dart | sort | awk -v n="$TEST_SHARDS" -v i="${{ matrix.shard }}" '(NR - 1) % n == i' | tr '\n' ' ')
          echo "Test files: $files"
          echo "TEST_FILES=$files" >> "$GITHUB_ENV"
      # The coverage is collected from the dart2js runs:
      - name: Run tests (Chrome ${{ matrix.compiler }}, shard ${{ matrix.shard }})
        run: dart test --platform chrome --compiler ${{ matrix.compiler }} --concurrency=$TEST_CONCURRENCY ${{ matrix.compiler == 'dart2js' && '--coverage=./coverage' || '' }} $TEST_FILES
      - name: Generate coverage report
        if: matrix.compiler == 'dart2js'
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage --packages=.dart_tool/package_config.json --report-on=lib --lcov -o ./coverage/lcov.info -i ./coverage
      - name: Upload coverage to Codecov
        if: matrix.compiler == 'dart2js'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage/
          flags: unittests
          env_vars: OS,DART
          fail_ci_if_error: true
          verbose: true

